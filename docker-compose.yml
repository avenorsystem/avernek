services:
  website:
    image: ${IMAGE_NAME:-avenor-website:local}

    build:
      context: .
      dockerfile: Dockerfile

      args:
        NODE_VERSION: ${NODE_VERSION:-22}

      secrets:
        - env_file

    restart: unless-stopped

    env_file:
      - ${ENV_FILE:-.env.local}

    ports:
      - "${PORT:-3000}:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

secrets:
  env_file:
    file: ${ENV_FILE:-.env.local}